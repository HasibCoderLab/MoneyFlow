packages:
  - 'apps/*'
  - 'packages/*'

# Build scripts that are explicitly approved (pnpm 12 no longer reads the
# "pnpm" field in package.json). These are required for:
# - prisma/@prisma/engines: downloading the query engine binaries
# - @swc/core: native binding used by the API test transform
minimumReleaseAgeExclude:
  - '@asamuzakjp/dom-selector@10.0.3'
  - '@next/env@16.4.1'
  - '@next/swc-darwin-arm64@16.4.1'
  - '@next/swc-darwin-x64@16.4.1'
  - '@next/swc-linux-arm64-gnu@16.4.1'
  - '@next/swc-linux-arm64-musl@16.4.1'
  - '@next/swc-linux-x64-gnu@16.4.1'
  - '@next/swc-linux-x64-musl@16.4.1'
  - '@next/swc-win32-arm64-msvc@16.4.1'
  - '@next/swc-win32-x64-msvc@16.4.1'
  - '@vitest/mocker@5.0.5'
  - '@vitest/spy@5.0.5'
  - jsdom@30.1.3
  - next@16.4.1
  - react-dom@19.3.1
  - react@19.3.1
  - vitest@5.0.5
  - '@better-auth/core@1.7.10'
  - '@better-auth/drizzle-adapter@1.7.10'
  - '@better-auth/kysely-adapter@1.7.10'
  - '@better-auth/memory-adapter@1.7.10'
  - '@better-auth/mongo-adapter@1.7.10'
  - '@better-auth/prisma-adapter@1.7.10'
  - '@better-auth/telemetry@1.7.10'
  - '@prisma/adapter-pg@7.10.1'
  - '@prisma/client-runtime-utils@7.10.1'
  - '@prisma/client@7.10.1'
  - '@prisma/debug@7.10.1'
  - '@prisma/driver-adapter-utils@7.10.1'
  - better-auth@1.7.10
  - auth@1.7.10
  - '@prisma/config@7.10.1'
  - '@prisma/engines@7.10.1'
  - '@prisma/fetch-engine@7.10.1'
  - '@prisma/get-platform@7.10.1'
  - prisma@7.10.1
allowBuilds:
  '@prisma/engines': true
  '@swc/core': true
  prisma: true
